[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aphb-crypt-agent"
version = "1.0.0"
description = "Agent IA de chiffrement automatique des répertoires de données de santé (age + Ollama local)"
readme = "README.md"
license = { text = "EUPL-1.2" }
requires-python = ">=3.10"
authors = [{ name = "Joseph Gomez" }]
dependencies = [
  "pyrage>=1.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "watchdog>=4.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.46", "pandas>=2.0"]
dev = ["pytest>=8.0", "faker>=25.0", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
cryptagent = "cryptagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
