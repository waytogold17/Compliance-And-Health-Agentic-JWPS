name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: SAST (bandit)
        run: bandit -q -r src -ll
      - name: Dépendances vulnérables du projet (pip-audit)
        run: pip-audit .
